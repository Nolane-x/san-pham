name: Apply release hardening wave

on:
  push:
    branches: [release-hardening-20260902]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[seed-release-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/release-hardening.patch
          git apply --check /tmp/release-hardening.patch
          git apply /tmp/release-hardening.patch
      - name: Verify release hardening
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/release/test_release_verifiers.py
          for verifier in \
            verify-repo.py \
            verify-structure.py \
            verify-csharp-lexical.py \
            verify-workflow-triggers.py \
            verify-workflow-control-flow.py \
            verify-history-intelligence.py \
            verify-settings-personalization.py \
            verify-settings-consistency.py \
            verify-work-recovery.py \
            verify-release-metadata.py \
            verify-commercial-metadata.py; do
            python "scripts/$verifier"
          done
          python scripts/source-release.py
          git diff --check
      - name: Commit verified wave
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nolane release bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-release-hardening.yml
          git add .
          git diff --cached --check
          git commit -m "ci: harden commercial and packaged MSIX contracts"
          git push origin HEAD:release-hardening-20260902
