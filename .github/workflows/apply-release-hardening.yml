name: Apply release hardening wave

on:
  push:
    branches: [release-hardening-20260902]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[seed-release-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply asserted release patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rewrite(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of anchor, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          rewrite('README.md', '$29.99', '$14.99')
          rewrite('README.md', '$19.99', '$9.99')
          rewrite('packaging/STORE_SUBMISSION.md', '$29.99', '$14.99', 2)
          rewrite('packaging/STORE_SUBMISSION.md', '$19.99', '$9.99', 2)

          rewrite(
              'scripts/verify-repo.py',
              "ROOT / 'packaging/STORE_SUBMISSION.md': ['$29.99', '$19.99', '90 consecutive days'],",
              "ROOT / 'packaging/STORE_SUBMISSION.md': ['magiccapture.desktop.pro', 'Durable', 'Forever', '90 consecutive days'],",
          )

          preflight_old = """python .\\scripts\\verify-release-metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata verification failed.' }
          """
          preflight_new = preflight_old + """
          python .\\scripts\\verify-commercial-metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Commercial metadata verification failed.' }
          """
          rewrite('scripts/store-preflight.ps1', preflight_old, preflight_new)

          source_old = "for verifier in ('verify-repo.py', 'verify-structure.py', 'verify-csharp-lexical.py', 'verify-workflow-triggers.py', 'verify-workflow-control-flow.py', 'verify-history-intelligence.py', 'verify-settings-personalization.py', 'verify-settings-consistency.py', 'verify-work-recovery.py'):"
          source_new = "for verifier in ('verify-repo.py', 'verify-structure.py', 'verify-csharp-lexical.py', 'verify-workflow-triggers.py', 'verify-workflow-control-flow.py', 'verify-history-intelligence.py', 'verify-settings-personalization.py', 'verify-settings-consistency.py', 'verify-work-recovery.py', 'verify-release-metadata.py', 'verify-commercial-metadata.py'):"
          rewrite('scripts/source-release.py', source_old, source_new)

          pack_old = """if ($LASTEXITCODE -ne 0) { throw \"MSIX packaging failed with exit code $LASTEXITCODE.\" }
          Write-Host \"Store package output: $OutputDirectory\" -ForegroundColor Green
          """
          pack_new = """if ($LASTEXITCODE -ne 0) { throw \"MSIX packaging failed with exit code $LASTEXITCODE.\" }

          $bundles = @(Get-ChildItem $OutputDirectory -Recurse -File -Filter *.msixbundle)
          if ($bundles.Count -ne 1) { throw \"Expected exactly one Store MSIX bundle, found $($bundles.Count).\" }
          python .\\scripts\\verify-msix-bundle.py $bundles[0].FullName --root $root --require-store-identity
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Store MSIX contract verification failed.' }

          $hash = (Get-FileHash -Algorithm SHA256 $bundles[0].FullName).Hash.ToLowerInvariant()
          $checksumPath = \"$($bundles[0].FullName).sha256\"
          \"$hash  $($bundles[0].Name)\" | Set-Content -Encoding ascii -NoNewline $checksumPath
          Write-Host \"Store package output: $OutputDirectory\" -ForegroundColor Green
          Write-Host \"Bundle SHA256: $hash\" -ForegroundColor Green
          """
          rewrite('scripts/pack.ps1', pack_old, pack_new)

          workflow = Path('.github/workflows/windows-ci.yml')
          text = workflow.read_text(encoding='utf-8')

          old_static = "            'verify-release-metadata.py'\n"
          new_static = "            'verify-release-metadata.py',\n            'verify-commercial-metadata.py'\n"
          if text.count(old_static) != 1:
              raise SystemExit('windows-ci.yml: static verifier anchor mismatch')
          text = text.replace(old_static, new_static, 1)

          start_marker = '      - name: Verify bundle architectures\n'
          end_marker = '      - name: Upload MSIX bundle\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('windows-ci.yml: MSIX verifier step anchors mismatch')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              "      - name: Verify packaged MSIX contract\n"
              "        shell: pwsh\n"
              "        run: |\n"
              "          $bundles = @(Get-ChildItem .\\artifacts\\msix-ci -Recurse -File -Filter *.msixbundle)\n"
              "          if ($bundles.Count -ne 1) { throw \"Expected exactly one MSIX bundle, found $($bundles.Count).\" }\n"
              "          python scripts/verify-msix-bundle.py $bundles[0].FullName --root $PWD\n"
              "          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundle verification failed.' }\n"
              "          $hash = (Get-FileHash -Algorithm SHA256 $bundles[0].FullName).Hash.ToLowerInvariant()\n"
              "          \"$hash  $($bundles[0].Name)\" | Set-Content -Encoding ascii -NoNewline \"$($bundles[0].FullName).sha256\"\n"
          )
          text = text[:start] + replacement + text[end:]

          old_upload = '          path: artifacts/msix-ci/**/*.msixbundle\n'
          new_upload = '          path: |\n            artifacts/msix-ci/**/*.msixbundle\n            artifacts/msix-ci/**/*.msixbundle.sha256\n'
          if text.count(old_upload) != 1:
              raise SystemExit('windows-ci.yml: artifact path anchor mismatch')
          text = text.replace(old_upload, new_upload, 1)

          old_source = "      - uses: actions/checkout@v7.0.1\n      - name: Source release dry run\n"
          new_source = "      - uses: actions/checkout@v7.0.1\n      - name: Release verifier regression tests\n        run: python -m unittest tests/release/test_release_verifiers.py\n      - name: Source release dry run\n"
          if text.count(old_source) != 1:
              raise SystemExit('windows-ci.yml: source-release anchor mismatch')
          text = text.replace(old_source, new_source, 1)
          workflow.write_text(text, encoding='utf-8')
          PY
      - name: Verify release hardening
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/release/test_release_verifiers.py
          for verifier in \
            verify-repo.py \
            verify-structure.py \
            verify-csharp-lexical.py \
            verify-workflow-triggers.py \
            verify-workflow-control-flow.py \
            verify-history-intelligence.py \
            verify-settings-personalization.py \
            verify-settings-consistency.py \
            verify-work-recovery.py \
            verify-release-metadata.py \
            verify-commercial-metadata.py; do
            python "scripts/$verifier"
          done
          python scripts/source-release.py
          git diff --check
      - name: Commit verified wave
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nolane release bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-release-hardening.yml
          git add .
          git diff --cached --check
          git commit -m "ci: harden commercial and packaged MSIX contracts"
          git push origin HEAD:release-hardening-20260902
