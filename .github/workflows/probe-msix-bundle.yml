name: Probe MSIX bundle

on:
  push:
    branches:
      - probe-msix-bundle-v416

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Verify source contract
        shell: pwsh
        run: python scripts/verify-repo.py
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw 'Visual Studio MSBuild installation not found.' }
          $path = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $path)) { throw "MSBuild.exe not found at $path" }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild: $path"
      - name: Build unsigned x64+ARM64 MSIX bundle
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts\msix-probe'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & '${{ steps.msbuild.outputs.path }}' .\src\Magic.Capture.App\Magic.Capture.App.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            '/p:AppxBundlePlatforms=x64|ARM64' `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$out\" `
            /p:AppxPackageSigningEnabled=false
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect generated packaging manifests
        if: always()
        shell: pwsh
        run: |
          $manifests = Get-ChildItem .\src\Magic.Capture.App\obj -Recurse -File -Filter AppxManifest.xml -ErrorAction SilentlyContinue
          if (-not $manifests) {
            Write-Host 'No generated AppxManifest.xml found.'
          } else {
            foreach ($manifest in $manifests) {
              Write-Host "===== $($manifest.FullName) ====="
              Get-Content $manifest.FullName | Select-String -Pattern 'Application|Extension|EntryPoint|Executable|startupTask|appExecutionAlias|Identity|TargetDeviceFamily' -Context 1,1
            }
          }
          $pri = Get-ChildItem .\src\Magic.Capture.App\obj -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'manifest|appx|pri|recipe' }
          $pri | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-msix-diagnostics
          path: |
            src/Magic.Capture.App/obj/**/AppxManifest.xml
            src/Magic.Capture.App/obj/**/*.appxrecipe
          if-no-files-found: warn
      - name: Require successful package output
        shell: pwsh
        run: |
          if ('${{ steps.package.outcome }}' -ne 'success') {
            throw 'MSIX packaging step failed; see generated manifest diagnostics above.'
          }
          $out = Join-Path $PWD 'artifacts\msix-probe'
          $packages = Get-ChildItem $out -Recurse -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') }
          if (-not $packages) { throw 'MSIX probe produced no package or bundle.' }
          $packages | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Upload MSIX probe output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-msix-probe
          path: artifacts/msix-probe/**
          if-no-files-found: error
