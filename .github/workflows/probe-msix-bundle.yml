name: Probe MSIX bundle

on:
  push:
    branches:
      - probe-msix-bundle-v416

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Verify source contract
        shell: pwsh
        run: python scripts/verify-repo.py
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw 'Visual Studio MSBuild installation not found.' }
          $path = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $path)) { throw "MSBuild.exe not found at $path" }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild: $path"
      - name: Build unsigned x64+ARM64 MSIX bundle
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts\msix-probe'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & '${{ steps.msbuild.outputs.path }}' .\src\Magic.Capture.App\Magic.Capture.App.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            '/p:AppxBundlePlatforms=x64|ARM64' `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$out\" `
            /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "MSIX probe failed with exit code $LASTEXITCODE." }
          $packages = Get-ChildItem $out -Recurse -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') }
          if (-not $packages) { throw 'MSIX probe produced no package or bundle.' }
          $packages | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Upload MSIX probe output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-msix-probe
          path: artifacts/msix-probe/**
          if-no-files-found: error
