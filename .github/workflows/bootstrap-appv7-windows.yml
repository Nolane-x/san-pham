name: Bootstrap App-v7 Windows

on:
  push:
    branches: [bootstrap-4.16-v5]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Reconstruct and verify app-v7 source
        shell: pwsh
        run: python bootstrap-appv7/reconstruct_appv7.py bootstrap-appv7 reconstructed

      - name: Apply verified Core and package fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_core_compile_fixes.py reconstructed

      - name: Apply verified WinUI XAML fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_winui_xaml_fixes.py reconstructed

      - name: Apply verified app C# syntax fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_csharp_fixes.py reconstructed

      - name: Apply verified app contract fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_contract_fixes.py reconstructed

      - name: Apply verified app compile batch2 fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_compile_batch2.py reconstructed

      - name: Apply verified app compile batch3 fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_compile_batch3.py reconstructed

      - name: Regression gate - resume checkpoint contract
        shell: pwsh
        run: python bootstrap-appv7/check_resume_checkpoint_contract.py reconstructed

      - name: Verify reconstructed SDK pin
        shell: pwsh
        run: |
          $sdk = (Get-Content reconstructed/global.json -Raw | ConvertFrom-Json).sdk.version
          if ($sdk -ne '10.0.400') { throw "Unexpected SDK pin: $sdk" }
          dotnet --version

      - name: Restore Core
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore src/Magic.Capture.Core/Magic.Capture.Core.csproj

      - name: Build Core
        shell: pwsh
        working-directory: reconstructed
        run: dotnet build src/Magic.Capture.Core/Magic.Capture.Core.csproj -c Release --no-restore

      - name: Restore WinUI app for platform
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore src/Magic.Capture.App/Magic.Capture.App.csproj -p:Platform=${{ matrix.platform }}

      - name: Build WinUI app
        shell: pwsh
        working-directory: reconstructed
        run: dotnet build src/Magic.Capture.App/Magic.Capture.App.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Verify platform build output
        shell: pwsh
        run: |
          $root = "reconstructed/src/Magic.Capture.App/bin/${{ matrix.platform }}/Release"
          if (-not (Test-Path $root)) { throw "Missing build output root: $root" }
          $desktop = Get-ChildItem $root -Recurse -File -Filter Magic.Capture.Desktop.dll
          if (-not $desktop) { throw "Magic.Capture.Desktop.dll not found under $root" }
          $count = (Get-ChildItem $root -Recurse -File).Count
          Write-Host "Verified ${{ matrix.platform }} output: files=$count desktop=$($desktop.FullName)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: magic-capture-desktop-bootstrap-${{ matrix.platform }}
          path: reconstructed/src/Magic.Capture.App/bin/${{ matrix.platform }}/Release/**
          if-no-files-found: error

  test-core:
    name: Core xUnit tests
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Reconstruct and verify app-v7 source
        shell: pwsh
        run: python bootstrap-appv7/reconstruct_appv7.py bootstrap-appv7 reconstructed

      - name: Apply verified Core and package fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_core_compile_fixes.py reconstructed

      - name: Reconstruct and verify 4.16 Core tests
        shell: pwsh
        run: python bootstrap-tests-v416/reconstruct_tests.py bootstrap-tests-v416 reconstructed

      - name: Apply verified Core test compile fixes
        shell: pwsh
        run: python bootstrap-tests-v416/apply_test_compile_fixes.py reconstructed

      - name: Regression gate - history monitor literals
        shell: pwsh
        run: python bootstrap-tests-v416/check_history_monitor_literals.py reconstructed

      - name: Verify reconstructed SDK pin
        shell: pwsh
        run: |
          $sdk = (Get-Content reconstructed/global.json -Raw | ConvertFrom-Json).sdk.version
          if ($sdk -ne '10.0.400') { throw "Unexpected SDK pin: $sdk" }
          dotnet --version

      - name: Restore Core tests
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj

      - name: Run Core xUnit tests
        shell: pwsh
        working-directory: reconstructed
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $output = & dotnet test tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults --verbosity minimal 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path TestResults/core-tests-console.txt -Encoding utf8
          if ($exitCode -eq 0) {
            $output | Select-Object -Last 25
          } else {
            Write-Host "=== COMPACT XUNIT FAILURE DIAGNOSTICS ==="
            $matches = $output | Select-String -Pattern 'Failed |Error Message:|Stack Trace:|Assert\.|Xunit\.|error CS|Test Run Failed|Failed!|Total tests:|Passed:|Failed:' -Context 2,8
            if ($matches) {
              $matches | ForEach-Object { $_.ToString() }
            } else {
              $output | Select-Object -Last 120
            }
            exit $exitCode
          }

      - name: Upload Core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-capture-core-tests
          path: reconstructed/TestResults/**
          if-no-files-found: error
