name: Bootstrap App-v7 Windows

on:
  push:
    branches: [bootstrap-4.16-v5]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Reconstruct and verify app-v7 source
        shell: pwsh
        run: python bootstrap-appv7/reconstruct_appv7.py bootstrap-appv7 reconstructed

      - name: Apply verified Core and package fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_core_compile_fixes.py reconstructed

      - name: Apply verified WinUI XAML fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_winui_xaml_fixes.py reconstructed

      - name: Apply verified app C# syntax fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_csharp_fixes.py reconstructed

      - name: Apply verified app contract fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_contract_fixes.py reconstructed

      - name: Apply verified app compile batch2 fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_compile_batch2.py reconstructed

      - name: Apply verified app compile batch3 fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_app_compile_batch3.py reconstructed

      - name: Regression gate - resume checkpoint contract
        shell: pwsh
        run: python bootstrap-appv7/check_resume_checkpoint_contract.py reconstructed

      - name: Verify reconstructed SDK pin
        shell: pwsh
        run: |
          $sdk = (Get-Content reconstructed/global.json -Raw | ConvertFrom-Json).sdk.version
          if ($sdk -ne '10.0.400') { throw "Unexpected SDK pin: $sdk" }
          dotnet --version

      - name: Restore Core
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore src/Magic.Capture.Core/Magic.Capture.Core.csproj

      - name: Build Core
        shell: pwsh
        working-directory: reconstructed
        run: dotnet build src/Magic.Capture.Core/Magic.Capture.Core.csproj -c Release --no-restore

      - name: Restore WinUI app for platform
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore src/Magic.Capture.App/Magic.Capture.App.csproj -p:Platform=${{ matrix.platform }}

      - name: Build WinUI app
        shell: pwsh
        working-directory: reconstructed
        run: dotnet build src/Magic.Capture.App/Magic.Capture.App.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Verify platform build output
        shell: pwsh
        run: |
          $root = "reconstructed/src/Magic.Capture.App/bin/${{ matrix.platform }}/Release"
          if (-not (Test-Path $root)) { throw "Missing build output root: $root" }
          $desktop = Get-ChildItem $root -Recurse -File -Filter Magic.Capture.Desktop.dll
          if (-not $desktop) { throw "Magic.Capture.Desktop.dll not found under $root" }
          $count = (Get-ChildItem $root -Recurse -File).Count
          Write-Host "Verified ${{ matrix.platform }} output: files=$count desktop=$($desktop.FullName)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: magic-capture-desktop-bootstrap-${{ matrix.platform }}
          path: reconstructed/src/Magic.Capture.App/bin/${{ matrix.platform }}/Release/**
          if-no-files-found: error

  test-core:
    name: Core xUnit tests
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Reconstruct and verify app-v7 source
        shell: pwsh
        run: python bootstrap-appv7/reconstruct_appv7.py bootstrap-appv7 reconstructed

      - name: Apply verified Core and package fixes
        shell: pwsh
        run: python bootstrap-appv7/apply_core_compile_fixes.py reconstructed

      - name: Reconstruct and verify 4.16 Core tests
        shell: pwsh
        run: python bootstrap-tests-v416/reconstruct_tests.py bootstrap-tests-v416 reconstructed

      - name: Apply verified Core test compile fixes
        shell: pwsh
        run: python bootstrap-tests-v416/apply_test_compile_fixes.py reconstructed

      - name: Regression gate - history monitor literals
        shell: pwsh
        run: python bootstrap-tests-v416/check_history_monitor_literals.py reconstructed

      - name: Verify reconstructed SDK pin
        shell: pwsh
        run: |
          $sdk = (Get-Content reconstructed/global.json -Raw | ConvertFrom-Json).sdk.version
          if ($sdk -ne '10.0.400') { throw "Unexpected SDK pin: $sdk" }
          dotnet --version

      - name: Restore Core tests
        shell: pwsh
        working-directory: reconstructed
        run: dotnet restore tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj

      - name: Run Core xUnit tests
        shell: pwsh
        working-directory: reconstructed
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $output = & dotnet test tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults --verbosity minimal 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path TestResults/core-tests-console.txt -Encoding utf8
          if ($exitCode -eq 0) {
            $output | Select-Object -Last 25
          } else {
            Write-Host "=== COMPACT XUNIT FAILURE DIAGNOSTICS ==="
            $matches = $output | Select-String -Pattern 'Failed |Error Message:|Stack Trace:|Assert\.|Xunit\.|error CS|Test Run Failed|Failed!|Total tests:|Passed:|Failed:' -Context 2,8
            if ($matches) {
              $matches | ForEach-Object { $_.ToString() }
            } else {
              $output | Select-Object -Last 120
            }
            exit $exitCode
          }

      - name: Upload Core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-capture-core-tests
          path: reconstructed/TestResults/**
          if-no-files-found: error

  promote-main:
    name: Promote verified clean source to main
    needs: test-core
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct verified clean source authority
        shell: pwsh
        run: |
          python bootstrap-appv7/reconstruct_appv7.py bootstrap-appv7 ../promote-source
          python bootstrap-appv7/apply_core_compile_fixes.py ../promote-source
          python bootstrap-appv7/apply_winui_xaml_fixes.py ../promote-source
          python bootstrap-appv7/apply_app_csharp_fixes.py ../promote-source
          python bootstrap-appv7/apply_app_contract_fixes.py ../promote-source
          python bootstrap-appv7/apply_app_compile_batch2.py ../promote-source
          python bootstrap-appv7/apply_app_compile_batch3.py ../promote-source
          python bootstrap-appv7/check_resume_checkpoint_contract.py ../promote-source
          python bootstrap-tests-v416/reconstruct_tests.py bootstrap-tests-v416 ../promote-source
          python bootstrap-tests-v416/apply_test_compile_fixes.py ../promote-source
          python bootstrap-tests-v416/check_history_monitor_literals.py ../promote-source
          python promotion-v416/reconstruct_legacy_root.py ../promote-source
          python promotion-v416/prepare_main_source.py ../promote-source

      - name: Static verification on clean source
        shell: pwsh
        working-directory: ../promote-source
        run: |
          $verifiers = @(
            'verify-repo.py',
            'verify-structure.py',
            'verify-csharp-lexical.py',
            'verify-workflow-triggers.py',
            'verify-workflow-control-flow.py',
            'verify-history-intelligence.py',
            'verify-settings-personalization.py',
            'verify-settings-consistency.py',
            'verify-work-recovery.py'
          )
          foreach ($verifier in $verifiers) {
            python (Join-Path 'scripts' $verifier)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Commit clean source to main
        shell: pwsh
        run: |
          $source = (Resolve-Path ../promote-source).Path
          git fetch origin main
          git checkout -B main origin/main
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Get-ChildItem -Force $source | ForEach-Object { Copy-Item $_.FullName -Destination . -Recurse -Force }
          $workflow = '.github/workflows/windows-ci.yml'
          if (-not (Test-Path $workflow)) { throw "Verified workflow missing before staged promotion" }
          Remove-Item $workflow -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $tracked = (git ls-files | Measure-Object -Line).Lines
          if ($tracked -ne 632) { throw "Expected 632 staged clean-source files before external workflow install, got $tracked" }
          if (git ls-files --error-unmatch $workflow 2>$null) {
            throw "Workflow file must be installed externally after staged promotion"
          }
          if (git ls-files | Select-String -Pattern '^bootstrap-|^promotion-v416/|^reconstructed/') {
            throw "Bootstrap transport leaked into main staging"
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "Promotion produced no changes" }
          git commit -m "release: stage verified Magic Capture Desktop 4.16.0 source"
          git push origin HEAD:main
