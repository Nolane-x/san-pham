name: Windows CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Static source verification
        shell: pwsh
        run: |
          $verifiers = @(
            'verify-repo.py',
            'verify-structure.py',
            'verify-csharp-lexical.py',
            'verify-workflow-triggers.py',
            'verify-workflow-control-flow.py',
            'verify-history-intelligence.py',
            'verify-settings-personalization.py',
            'verify-settings-consistency.py',
            'verify-work-recovery.py',
            'verify-release-metadata.py',
            'verify-commercial-metadata.py'
          )
          foreach ($verifier in $verifiers) {
            python (Join-Path 'scripts' $verifier)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Restore Core tests
        shell: pwsh
        run: dotnet restore tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj
      - name: Core tests
        shell: pwsh
        run: dotnet test tests/Magic.Capture.Core.Tests/Magic.Capture.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI app for platform
        shell: pwsh
        run: dotnet restore src/Magic.Capture.App/Magic.Capture.App.csproj -p:Platform=${{ matrix.platform }}
      - name: Build WinUI app
        shell: pwsh
        run: dotnet build src/Magic.Capture.App/Magic.Capture.App.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore -warnAsError:MSB3277
      - name: Upload build output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-${{ matrix.platform }}
          path: src/Magic.Capture.App/bin/${{ matrix.platform }}/Release/**
          if-no-files-found: error

  msix-package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Verify release metadata
        shell: pwsh
        run: python scripts/verify-release-metadata.py
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw 'Visual Studio MSBuild installation not found.' }
          $path = Join-Path $install 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $path)) { throw "MSBuild.exe not found at $path" }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "MSBuild: $path"
      - name: Build unsigned x64+ARM64 MSIX bundle
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts\msix-ci'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & '${{ steps.msbuild.outputs.path }}' .\src\Magic.Capture.App\Magic.Capture.App.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            '/p:AppxBundlePlatforms=x64|ARM64' `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$out\" `
            /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed with exit code $LASTEXITCODE." }
      - name: Verify packaged MSIX contract
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem .\artifacts\msix-ci -Recurse -File -Filter *.msixbundle)
          if ($bundles.Count -ne 1) { throw "Expected exactly one MSIX bundle, found $($bundles.Count)." }
          python scripts/verify-msix-bundle.py $bundles[0].FullName --root $PWD
          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundle verification failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 $bundles[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($bundles[0].Name)" | Set-Content -Encoding ascii -NoNewline "$($bundles[0].FullName).sha256"
      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-msix-bundle
          path: |
            artifacts/msix-ci/**/*.msixbundle
            artifacts/msix-ci/**/*.msixbundle.sha256
          if-no-files-found: error

  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Release verifier regression tests
        run: python -m unittest tests/release/test_release_verifiers.py
      - name: Source release dry run
        run: python scripts/source-release.py
      - name: Stage deterministic source bundle
        run: |
          mkdir -p release-artifacts
          cp ../Magic-Capture-Desktop-*-source.zip release-artifacts/
          cp ../Magic-Capture-Desktop-*-source.zip.sha256 release-artifacts/
      - name: Upload deterministic source bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: magic-capture-desktop-source
          path: release-artifacts/**
          if-no-files-found: error
